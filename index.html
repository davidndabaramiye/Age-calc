<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fun AI age calculator that computes your age from your birthdate and adds a playful message.">
  <title>AI Age Fun Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>AI Age Fun Calculator 🤖🎉</h1>
      <p>Tell the AI your birthday and it will compute your age in years, months, and days — plus a fun message tuned just for you.</p>
    </header>

    <form class="card" id="ageForm">
      <label for="birthdate">Date of Birth</label>
      <input type="date" id="birthdate" aria-label="Birth date" required>
      <p class="hint">Choose your birthday and press the button. The AI assistant will do the rest.</p>

      <button id="calculateButton" type="submit">Calculate My Age</button>
    </form>

    <div id="result" class="result hidden" aria-live="polite">
      <h2>🎈 Your Age Result</h2>
      <p id="ageText"></p>
      <p id="messageText" class="message"></p>
    </div>

    <footer>
      <p>Made for smiles, not just numbers.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
